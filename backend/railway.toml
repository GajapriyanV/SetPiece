# Existing Go service: root /backend, config /backend/railway.toml.
# See PRODUCTION.md: use explicit drain/stop/start for single-owner replacements.
[build]
dockerfilePath = "Dockerfile"

[deploy]
numReplicas = 1
healthcheckPath = "/ready"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
drainingSeconds = 20
