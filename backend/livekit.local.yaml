# Isolated development only. These are LiveKit's public dev credentials.
development: true
port: 7880
bind_addresses:
  - 127.0.0.1
rtc:
  node_ip: 127.0.0.1
  # Disable TCP fallback, which otherwise binds wildcard interfaces.
  tcp_port: 0
  udp_port: 7882
  use_external_ip: false
  enable_loopback_candidate: true
  ips:
    includes:
      - 127.0.0.1/32
keys:
  devkey: secret
logging:
  level: warn
  pion_level: error
