# Separate Go service; set root directory /backend and config path /backend/railway.toml.
# Not a live cutover configuration: production writes/media remain guarded.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
numReplicas = 1
healthcheckPath = "/ready"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
drainingSeconds = 20
